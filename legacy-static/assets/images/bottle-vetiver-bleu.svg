<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 620" width="400" height="620"><defs>
    <linearGradient id="vetiver-bleu-cap" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#0d0d0d"/><stop offset="0.2" stop-color="#3a3a3a"/><stop offset="0.32" stop-color="#6b6b6b"/><stop offset="0.5" stop-color="#1a1a1a"/><stop offset="0.85" stop-color="#0a0a0a"/><stop offset="1" stop-color="#2a2a2a"/></linearGradient>
    <linearGradient id="vetiver-bleu-captop" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vetiver-bleu-liq" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#D8E6DE"/><stop offset="1" stop-color="#7FA394"/>
    </linearGradient>
    <linearGradient id="vetiver-bleu-liqside" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#000" stop-opacity=".28"/><stop offset=".25" stop-color="#000" stop-opacity="0"/>
      <stop offset=".75" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/>
    </linearGradient>
    <linearGradient id="vetiver-bleu-glass" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".08" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".05"/><stop offset=".92" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="vetiver-bleu-base" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".1"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="vetiver-bleu-shadow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vetiver-bleu-glow" cx=".5" cy=".6" r=".5">
      <stop offset="0" stop-color="#D8E6DE" stop-opacity=".55"/><stop offset="1" stop-color="#D8E6DE" stop-opacity="0"/>
    </radialGradient>
    <filter id="vetiver-bleu-blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="vetiver-bleu-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    </defs>
  <g>
    <ellipse cx="200" cy="580" rx="170" ry="22" fill="url(#vetiver-bleu-shadow)"/>
    <ellipse cx="200" cy="585" rx="120" ry="14" fill="url(#vetiver-bleu-glow)" filter="url(#vetiver-bleu-soft)"/>
    <!-- glass body -->
    <rect x="70" y="190" width="260" height="385" rx="30" fill="#7FA394" fill-opacity=".18"/>
    <!-- liquid -->
    <rect x="90" y="238" width="220" height="292" rx="14" fill="url(#vetiver-bleu-liq)"/>
    <rect x="90" y="238" width="220" height="292" rx="14" fill="url(#vetiver-bleu-liqside)"/>
    <rect x="92" y="238" width="216" height="6" rx="3" fill="#fff" fill-opacity=".35"/>
    <!-- thick base -->
    <rect x="72" y="520" width="256" height="53" rx="22" fill="url(#vetiver-bleu-base)"/>
    <rect x="90" y="528" width="220" height="3" fill="#fff" fill-opacity=".5"/>
    <!-- glass sheen -->
    <rect x="70" y="190" width="260" height="385" rx="30" fill="url(#vetiver-bleu-glass)"/>
    <rect x="70.5" y="190.5" width="259" height="384" rx="30" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="1.5"/>
    <rect x="84" y="210" width="12" height="340" rx="6" fill="#fff" fill-opacity=".55"/>
    <rect x="102" y="215" width="4" height="320" rx="2" fill="#fff" fill-opacity=".3"/>
    <rect x="304" y="215" width="7" height="330" rx="3.5" fill="#fff" fill-opacity=".35"/>
    <!-- shoulders -->
    <rect x="70" y="190" width="260" height="22" rx="11" fill="#fff" fill-opacity=".25"/>
    <!-- label -->
    <g>
      <rect x="128" y="322" width="144" height="150" rx="2" fill="#FBFAF6"/>
      <rect x="134" y="328" width="132" height="138" rx="1" fill="none" stroke="#1F3A33" stroke-opacity=".35" stroke-width=".8"/>
      <text x="200" y="356" text-anchor="middle" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-size="17" letter-spacing="6" fill="#1F3A33">ÉLARA</text>
      <line x1="182" x2="218" y1="367" y2="367" stroke="#1F3A33" stroke-opacity=".5" stroke-width=".8"/>
      <text x="200" y="405" text-anchor="middle" font-family="'Cormorant Garamond', 'Times New Roman', Georgia, serif" font-style="italic" font-size="24" fill="#1F3A33">Vétiver Bleu</text>
      <text x="200" y="433" text-anchor="middle" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="8" letter-spacing="3" fill="#1F3A33">EAU DE PARFUM</text>
      <text x="200" y="454" text-anchor="middle" font-family="'DM Sans', Helvetica, Arial, sans-serif" font-size="8" letter-spacing="2" fill="#1F3A33" fill-opacity=".7">50 ML · 1.7 FL.OZ</text>
    </g>
    <!-- neck / collar -->
    <rect x="172" y="160" width="56" height="34" rx="4" fill="url(#vetiver-bleu-cap)"/>
    <rect x="172" y="160" width="56" height="5" fill="#000" fill-opacity=".25"/>
    <!-- cap -->
    <rect x="132" y="38" width="136" height="126" rx="10" fill="url(#vetiver-bleu-cap)"/>
    <rect x="132" y="38" width="136" height="40" rx="10" fill="url(#vetiver-bleu-captop)"/>
    <rect x="132" y="150" width="136" height="14" rx="4" fill="#000" fill-opacity=".18"/>
    <rect x="150" y="48" width="6" height="104" rx="3" fill="#fff" fill-opacity=".45"/>
  </g></svg>